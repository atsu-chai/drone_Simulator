<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アカウントと利用状況 | 実地試験トレーナー</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="site.css"></head><body class="site"><nav><a class="brand" href="home.html">DRONE / 実地試験トレーナー</a><span><a href="learn.html">学習ガイド</a><a href="index.html">無料体験</a><a href="account.html">アカウント</a><a href="contact.html">お問い合わせ</a></span></nav><main><header class="page-heading"><h1>アカウントと利用状況</h1><p>無料体験は登録不要。検証参加者には運営から利用期間を設定します。</p></header><section class="split"><form id="authForm"><h2>登録・ログイン</h2><label>メールアドレス<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>パスワード（12文字以上）<input name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><div class="actions"><button name="action" value="login" class="action">ログイン</button><button name="action" value="register">新規登録</button></div><p>現在、パスワードをお忘れの場合はお問い合わせください。本人確認後に運営で対応します。</p></form><div><h2>利用状況</h2><p id="accountStatus" role="status">確認中…</p><p>料金：初月10,000円、翌月同日から月額3,000円で自動更新。月末に同日がない場合は決済サービスの月次請求日に従います。</p><label class="inline"><input type="checkbox" id="termsAccepted">料金・自動更新・再契約時の初月料金と<a href="legal.html">利用条件</a>を確認しました</label><div class="actions"><button id="checkoutButton" class="action" disabled>購入手続き（販売準備中）</button><button id="portalButton" disabled>解約・支払い方法を管理</button><button id="logoutButton">ログアウト</button></div><p id="accountMessage" role="status"></p><p>決済画面から戻っただけでは利用権は付与されません。決済確認後、利用状況を更新します。</p></div></section></main><footer><a href="legal.html">利用条件・プライバシー・販売準備状況</a><span>二等・マルチローター・基本 / 検証版 0.2</span></footer><script type="module" src="site.js"></script></body></html>
